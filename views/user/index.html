<section>
	<h1>Add user</h1>
	<form class="row" method="post" action="/users">
		<input type="text" name="name" placeholder="Name" required />
		<button type="submit">Add user</button>
	</form>
</section>

<section>
	<h2>Users</h2>
	<ul class="list">
		{{range .Users}}
		<li>{{.Name}}</li>
		{{else}}
		<li class="empty">No users yet</li>
		{{end}}
	</ul>
</section>
